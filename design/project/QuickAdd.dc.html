<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wingman — Quick add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F55D4}a:hover{color:#1E3C9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #5E6170; color: #141826; font-family: 'DM Sans', system-ui, sans-serif">

  <div aria-hidden="true" style="padding: 56px 24px; display: flex; flex-direction: column; gap: 6px; color: #C9CCD6">
    <span style="font-size: 14px; font-weight: 500">SUNDAY, OCT 11</span>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 700">Morning, Ron</span>
  </div>

  <section aria-label="New item" style="position: absolute; left: 0; right: 0; bottom: 0; height: 690px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 24px 32px; display: flex; flex-direction: column; gap: 20px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D6D9E1"></span>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700">New</h1>
      <div role="tablist" aria-label="Type" style="display: flex; gap: 4px; padding: 4px; background: #EEF0F4; border-radius: 12px">
        <button role="tab" aria-selected="false" style="min-height: 36px; padding: 0 14px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 500; color: #4A5064">Task</button>
        <button role="tab" aria-selected="true" style="min-height: 36px; padding: 0 14px; border: none; border-radius: 9px; background: #141826; font-family: inherit; font-size: 13px; font-weight: 700; color: #FFFFFF">Event</button>
        <button role="tab" aria-selected="false" style="min-height: 36px; padding: 0 14px; border: none; border-radius: 9px; background: transparent; font-family: inherit; font-size: 13px; font-weight: 500; color: #4A5064">Reminder</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="qa-input" style="font-size: 13px; font-weight: 500; color: #5B6175">Just type it — Wingman figures out the rest</label>
      <input id="qa-input" value="Dentist Thursday 4:30pm remind me a day before" style="min-height: 56px; box-sizing: border-box; padding: 0 16px; border: 2px solid #141826; border-radius: 16px; font-family: inherit; font-size: 16px; color: #141826; background: #FFFFFF">
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 500; color: #5B6175">Understood as</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button style="min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid #E3E5EB; background: #F7F8FA; display: flex; gap: 8px; align-items: center; font-family: inherit; font-size: 14px; font-weight: 500; color: #141826"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="#2F55D4" stroke-width="2"></rect><path d="M3.5 10h17" stroke="#2F55D4" stroke-width="2"></path></svg>Thu, Oct 15</button>
        <button style="min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid #E3E5EB; background: #F7F8FA; display: flex; gap: 8px; align-items: center; font-family: inherit; font-size: 14px; font-weight: 500; color: #141826"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#2F55D4" stroke-width="2"></circle><path d="M12 7.5V12l3 2" fill="none" stroke="#2F55D4" stroke-width="2" stroke-linecap="round"></path></svg>16:30 – 17:30</button>
        <button style="min-height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid #E3E5EB; background: #F7F8FA; display: flex; gap: 8px; align-items: center; font-family: inherit; font-size: 14px; font-weight: 500; color: #141826"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="#D24B1F" stroke-width="2" stroke-linejoin="round"></path></svg>1 day before</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 500; color: #5B6175">Category</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button style="min-height: 44px; border-radius: 12px; border: 1px solid #E3E5EB; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #141826; display: flex; gap: 6px; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2F55D4"></span>Work</button>
        <button style="min-height: 44px; border-radius: 12px; border: 1px solid #E3E5EB; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #141826; display: flex; gap: 6px; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D24B1F"></span>Personal</button>
        <button aria-pressed="true" style="min-height: 44px; border-radius: 12px; border: 2px solid #17805A; background: #E8F4EE; font-family: inherit; font-size: 13px; font-weight: 700; color: #0F5A3F; display: flex; gap: 6px; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: #17805A"></span>Health</button>
        <button style="min-height: 44px; border-radius: 12px; border: 1px solid #E3E5EB; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 500; color: #141826; display: flex; gap: 6px; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: #7044D6"></span>Errands</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 500; color: #5B6175">Notify me by</span>
      <div style="display: flex; gap: 8px">
        <button aria-pressed="true" style="flex: 1; min-height: 44px; border-radius: 12px; border: 2px solid #141826; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141826">Push</button>
        <button aria-pressed="true" style="flex: 1; min-height: 44px; border-radius: 12px; border: 2px solid #141826; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 700; color: #141826">Email</button>
        <button aria-pressed="false" style="flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid #E3E5EB; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #4A5064">Alarm</button>
        <button aria-pressed="false" style="flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid #E3E5EB; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500; color: #4A5064">Silent</button>
      </div>
    </div>

    <div style="flex-grow: 1"></div>
    <div style="display: flex; gap: 10px">
      <a href="Main.dc.html" style="flex: 1; min-height: 56px; border-radius: 16px; border: 1px solid #E3E5EB; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #141826; font-size: 16px; font-weight: 500">Cancel</a>
      <a href="Main.dc.html" style="flex: 2; min-height: 56px; border-radius: 16px; background: #D24B1F; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #FFFFFF; font-size: 16px; font-weight: 700">Add to my day</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
