<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F5F7">
  <script>
    // Apply saved theme and language before first paint to avoid a flash.
    try {
      var st = JSON.parse(localStorage.getItem('wingman:v1') || '{}').settings || {};
      if (st.theme === 'light' || st.theme === 'dark') document.documentElement.dataset.theme = st.theme;
      if (st.language === 'he') { document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl'; }
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
