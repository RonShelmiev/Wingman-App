<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wingman — Life areas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F55D4}a:hover{color:#1E3C9E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F5F7; color: #141826; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="padding: 56px 24px 16px; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.1">Life areas</h1>
    <p style="margin: 0; font-size: 15px; color: #4A5064; line-height: 1.4">Everything you look after, in one place. Rename, recolor or add your own.</p>
  </header>

  <div style="padding: 0 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{areas}}" as="a" hint-placeholder-count="8">
      <button style="min-height: 104px; border: none; border-radius: 18px; background: #FFFFFF; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; font-family: inherit; color: #141826">
        <span style="{{a.dotStyle}}"></span>
        <span style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 16px; font-weight: 700">{{a.name}}</span>
          <span style="font-size: 12px; color: #5B6175">{{a.meta}}</span>
        </span>
      </button>
    </sc-for>
    <button style="min-height: 104px; border: 2px dashed #B7BCCB; border-radius: 18px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 15px; font-weight: 700; color: #141826">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#141826" stroke-width="2.2" stroke-linecap="round"></path></svg>
      New area
    </button>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 68px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 8px 24px rgba(20,24,38,0.10); display: flex; justify-content: space-around; align-items: center">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; text-decoration: none; color: #5B6175; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>Today</a>
    <a href="Week.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; text-decoration: none; color: #5B6175; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"></rect><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>Week</a>
    <a href="QuickAdd.dc.html" aria-label="Add task or reminder" style="width: 56px; height: 56px; border-radius: 20px; background: #D24B1F; display: flex; align-items: center; justify-content: center; margin-top: -28px; box-shadow: 0 6px 16px rgba(210,75,31,0.35)">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></a>
    <a href="Reminders.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; text-decoration: none; color: #5B6175; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z M10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>Reminders</a>
    <a href="Notifications.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; text-decoration: none; color: #141826; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const areas = [
      ['Work', '#2F55D4', '6 open · 2 today'],
      ['Home', '#B4690E', '4 open'],
      ['Health', '#17805A', '3 open · 1 today'],
      ['Money', '#0E7C86', '2 open · 1 overdue'],
      ['Family & friends', '#C2367A', '3 open · 2 today'],
      ['Learning', '#4B5563', '1 open'],
      ['Errands', '#7044D6', '2 open · 1 today']
    ];
    return {
      areas: areas.map(([name, color, meta]) => ({
        name, meta,
        dotStyle: 'width: 28px; height: 28px; border-radius: 9px; background: ' + color + ';'
      }))
    };
  }
}
</script>
</body>
</html>
